name: Lians check
description: Checks each agent-written PR against its ticket as it reads now. Built for robotics teams, before code reaches hardware.
branding:
  icon: check-square
  color: blue
inputs:
  anthropic-api-key:
    description: Claude API key. Without it, Lians posts a setup note instead of a review.
    required: false
  linear-api-key:
    description: Linear API key (read-only), to check Linear tickets named in the PR title, branch or body.
    required: false
  jira-base-url:
    description: Your Jira site, e.g. https://acme.atlassian.net. With jira-email and jira-api-token, Lians checks Jira issues (PROJ-123) named in the PR title, branch or body.
    required: false
  jira-email:
    description: Email of the Jira account that owns jira-api-token.
    required: false
  jira-api-token:
    description: Jira API token (read access to the issues is enough).
    required: false
  robot-context:
    description: "auto: in ROS-style repos (a package.xml), also read parameter, launch and URDF files that the diff doesn't show, so limits and settings can be checked. off: diff only."
    default: auto
  mode:
    description: "check: comment on the PR (default). export: write a traceability record of every Lians check in the repo (CSV + Markdown) and upload it as the lians-trace artifact."
    default: check
  github-token:
    description: Token used to read the PR and tickets and to post the comment.
    default: ${{ github.token }}
  fail-on-missed:
    description: Fail the check when a requirement is missed or partly built.
    default: "false"
  model:
    description: Claude model used for the review.
    default: claude-opus-5-5
  bedrock-model:
    description: Amazon Bedrock model ID or inference profile. When set, Lians calls Claude through your own AWS account (including GovCloud) instead of the Anthropic API, so the diff stays in your AWS. Configure AWS credentials in an earlier step.
    required: false
  aws-region:
    description: AWS region for Bedrock, for example us-gov-west-1. Defaults to the region your AWS credentials step set.
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "anthropic[bedrock]>=0.103"
    - shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        LINEAR_API_KEY: ${{ inputs.linear-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        LIANS_CHECK_MODEL: ${{ inputs.model }}
        LIANS_BEDROCK_MODEL: ${{ inputs.bedrock-model }}
        JIRA_BASE_URL: ${{ inputs.jira-base-url }}
        JIRA_EMAIL: ${{ inputs.jira-email }}
        JIRA_API_TOKEN: ${{ inputs.jira-api-token }}
        LIANS_ROBOT_CONTEXT: ${{ inputs.robot-context }}
        LIANS_MODE: ${{ inputs.mode }}
        AWS_REGION: ${{ inputs.aws-region || env.AWS_REGION }}
        FAIL_ON_MISSED: ${{ inputs.fail-on-missed }}
      run: |
        args=()
        [ "$FAIL_ON_MISSED" = "true" ] && args+=(--fail-on-missed)
        if [ "$LIANS_MODE" = "export" ]; then
          mkdir -p lians-trace
          python "$GITHUB_ACTION_PATH/lians_check.py" --export --out lians-trace/lians-trace.csv
        else
          python "$GITHUB_ACTION_PATH/lians_check.py" "${args[@]}"
        fi
    - if: inputs.mode == 'export'
      uses: actions/upload-artifact@v4
      with:
        name: lians-trace
        path: lians-trace/
